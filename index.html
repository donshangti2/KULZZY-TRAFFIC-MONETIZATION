<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kulzzy Radio - Advertise</title>

  <link rel="stylesheet" href="style.css">


  <!-- Firebase -->

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

</head>


<body class="public-body">


  <div class="public-wrapper">


    <header class="public-header">

      <div class="logo-circle">
        K
      </div>

      <h1>
        KULZZY RADIO
      </h1>

      <p>
        Celebrating Lives Everyday
      </p>

    </header>


    <!-- ADVERTISEMENT -->

    <section class="ad-section">

      <div class="section-heading">

        <span>
          SPONSORED
        </span>

        <h2>
          Featured Advertisement
        </h2>

      </div>


      <div
        id="kulzzyAdContainer"
        class="kulzzy-ad-container"
      >

        <div class="loading-ad">
          Loading advertisement...
        </div>

      </div>

    </section>


    <!-- SELL AD SPACE -->

    <section class="advertise-section">

      <h2>
        Advertise With Kulzzy Radio
      </h2>

      <p>
        Put your business, product or service
        in front of the Kulzzy Radio audience.
      </p>

      <a
        href="https://wa.me/"
        class="advertise-btn"
        target="_blank"
        rel="noopener"
      >
        ADVERTISE WITH US
      </a>

    </section>


    <footer>

      © 2026 Kulzzy Radio Network

      <br>

      Celebrating Lives Everyday

    </footer>


  </div>


  <script src="firebase.js"></script>

  <script src="ads.js"></script>

</body>

</html>
